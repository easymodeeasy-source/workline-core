[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workline-core"
version = "0.1.0"
description = "Workline core validators and runtime primitives"
requires-python = ">=3.11"

[project.scripts]
workline = "workline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
